[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Function is dependency-free; Netlify's default bundler is fine.
  directory = "netlify/functions"

[dev]
  framework = "#static"
  publish = "."
  port = 8888

# Friendly route used by app.js. Works locally (netlify dev) and in production.
[[redirects]]
  from = "/api/iqama-ocr"
  to = "/.netlify/functions/iqama-ocr"
  status = 200
  force = true
